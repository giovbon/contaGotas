name: readingdrip

# Deploy de referência (docs/operations.md). Copie .env.example para .env,
# preencha os segredos e rode `docker compose up -d --build`.
#
# A imagem espera /data com owner 65532:65532:
#   sudo chown -R 65532:65532 ./data

services:
  app:
    image: ${RD_IMAGE:-readingdrip:latest}
    build:
      context: .
      args:
        VERSION: ${RD_VERSION:-dev}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./data:/data
    environment:
      APP_BASE_URL: ${APP_BASE_URL:?defina APP_BASE_URL no .env}
      APP_PASSWORD: ${APP_PASSWORD:?defina APP_PASSWORD no .env}
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET no .env}
      BEHIND_CLOUDFLARE: "true"
      MAX_UPLOAD_BYTES: "99614720"
      TZ: ${TZ:-America/Sao_Paulo}
    mem_limit: 256m
    cpus: "1.5"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/readingdrip", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?defina CF_TUNNEL_TOKEN no .env}
    depends_on:
      app:
        condition: service_healthy

  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    volumes:
      - ./deploy/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ./deploy/ntfy/cache:/var/cache/ntfy
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
