name: readingdrip

# Template de deploy com a imagem publicada no Docker Hub (sem build local).
# Publicação da imagem: .github/workflows/docker.yml (linux/arm64).
#
# Uso num servidor com Docker + Compose v2:
#
#   mkdir -p readingdrip/data readingdrip/ntfy && cd readingdrip
#   cp <repo>/deploy/compose.template.yml docker-compose.yml
#   cp <repo>/deploy/ntfy/server.yml ntfy/
#   cp <repo>/.env.example .env && ${EDITOR} .env
#     # RD_IMAGE=giovbon/readingdrip:latest
#   sudo chown -R 65532:65532 data
#   docker compose up -d && docker compose ps   # app deve ficar healthy
#
# Sem Cloudflare Tunnel: apague o serviço `cloudflared` e libere a porta
# "8080:8080" (ou mantenha 127.0.0.1:8080 e use um proxy reverso).
# O ntfy fica na rede interna; o app fala com `http://ntfy:8080` e o
# túnel encaminha `ntfy.<domínio>` para `http://ntfy:8080`.

services:
  app:
    image: ${RD_IMAGE:-readingdrip:latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./data:/data
    environment:
      APP_BASE_URL: ${APP_BASE_URL:?defina APP_BASE_URL no .env}
      APP_PASSWORD: ${APP_PASSWORD:?defina APP_PASSWORD no .env}
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET no .env}
      BEHIND_CLOUDFLARE: "true"
      MAX_UPLOAD_BYTES: "99614720"
      TZ: ${TZ:-America/Sao_Paulo}
    # Q-016: PDF com figuras grandes pico ~330 MB — suba para 384m se usar.
    mem_limit: 256m
    cpus: "1.5"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/readingdrip", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:?defina CF_TUNNEL_TOKEN no .env}
    depends_on:
      app:
        condition: service_healthy

  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ./ntfy/cache:/var/cache/ntfy
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
